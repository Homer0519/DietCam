name: Build DietCam APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing config
        # 签名材料不在仓库里（密钥库与口令都已被 .gitignore 排除）。
        # 配了 secret 就从 secret 还原；没配就退化成 debug 签名并显式告警 ——
        # debug 签名的包无法覆盖升级正式包，不能当发布件用。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/dietcam-release.jks
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            echo "已从 GitHub Secrets 还原签名密钥"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 / KEYSTORE_PROPERTIES，本次产物为 debug 签名，不能覆盖升级正式包"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "产物: $APK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" | head -n 3
          fi

      - name: Show build outputs
        if: always()
        run: find app/build/outputs -type f -name '*.apk' -printf '%p  %k KB\n' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DietCam-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

name: Build DietCam APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        # 不用 android-actions/setup-android@v3：它会把 runner 预装的 cmdline-tools
        # 判成 "Wrong version in preinstalled sdkmanager"，然后去跑一个在新版
        # cmdline-tools 里已经被移除的 `sdkmanager tools`，整步直接失败
        # （2026-09-19 起 ubuntu-latest 镜像上必现，与我们自己的代码无关）。
        #
        # ubuntu-latest 本来就带 Android SDK，这里只补上真正需要的两个包，
        # 并且把路径显式写进环境变量，免得 AGP 找不到。
        working-directory: .
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager = $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          echo "--- 已装平台 ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- 已装 build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true

      - name: Prepare signing config
        # 签名材料不在仓库里（密钥库与口令都已被 .gitignore 排除）。
        # 配了 secret 就从 secret 还原；没配就退化成 debug 签名并显式告警 ——
        # debug 签名的包无法覆盖升级正式包，不能当发布件用。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/dietcam-release.jks
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            echo "已从 GitHub Secrets 还原签名密钥"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 / KEYSTORE_PROPERTIES，本次产物为 debug 签名，不能覆盖升级正式包"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Verify signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "产物: $APK"
          BT="$(ls -d "${ANDROID_SDK_ROOT}/build-tools/"*/ 2>/dev/null | tail -n 1)"
          if [ -n "$BT" ] && [ -x "${BT}apksigner" ]; then
            "${BT}apksigner" verify --print-certs "$APK" | head -n 3
          fi

      - name: Show build outputs
        if: always()
        run: find app/build/outputs -type f -name '*.apk' -printf '%p  %k KB\n' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DietCam-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

name: Build DietCam APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dietcam/android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'dietcam/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dietcam/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing config
        # 仓库里不再存明文口令：配了 secret 就用它生成 keystore.properties，
        # 没配就退化成 debug 签名 —— 那样打出来的包无法覆盖升级正式包，所以显式告警。
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            echo "已从 KEYSTORE_PROPERTIES secret 写入签名配置"
          elif [ -f keystore.properties ]; then
            echo "使用仓库内已有的 keystore.properties"
          else
            echo "::warning::未配置 KEYSTORE_PROPERTIES secret，本次产物为 debug 签名，不能覆盖升级正式包"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Show build outputs
        if: always()
        run: find app/build/outputs -type f -name '*.apk' -printf '%p  %k KB\n' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DietCam-release-apk
          path: dietcam/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

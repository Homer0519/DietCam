- insert:
    - id: dsh-astrbot
      name: 'dsh-astrbot'
      config:
        # AstrBot 的地址。可以只写站点根地址，插件会自动补上
        # /api/v1/plugins/extensions/astrbot_plugin_dsh_bridge
        baseUrl: 'https://your-astrbot.example.com'
        # AstrBot 的 API Key（WebUI -> 设置 -> API Key，权限勾选 plugin，abk_ 开头）
        apiKey: ''
        # AstrBot 插件里填的那个 hmac_secret，必须一模一样
        secret: ''
        # Harness 会话的工作目录；留空则用 DSH 当前工作目录
        workspace: ''
        # 允许使用机器人的用户 id；留空表示不限制
        allowUsers: []
        enabled: true
